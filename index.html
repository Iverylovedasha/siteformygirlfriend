<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Даши ❤️ 6 месяцев</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Плавающие сердечки на фоне */
        .hearts-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .heart-float {
            position: absolute;
            color: rgba(255, 107, 129, 0.15);
            font-size: 20px;
            animation: floatUp linear infinite;
            bottom: -50px;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        /* Экран входа */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 1s ease, visibility 1s ease;
        }

        #intro-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .intro-heart {
            font-size: 80px;
            animation: beat 1.5s ease-in-out infinite;
            cursor: pointer;
            filter: drop-shadow(0 0 30px rgba(255, 107, 129, 0.6));
        }

        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .intro-text {
            margin-top: 30px;
            font-size: 1.2rem;
            color: #ffb8c6;
            letter-spacing: 2px;
            text-align: center;
            padding: 0 20px;
        }

        .click-hint {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #8899aa;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Основной контент */
        .main-content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 40px 20px;
            max-width: 800px;
            width: 100%;
            opacity: 0;
            transition: opacity 1.5s ease 0.5s;
        }

        .main-content.visible {
            opacity: 1;
        }

        .anniversary-badge {
            display: inline-block;
            background: rgba(255, 107, 129, 0.2);
            border: 1px solid rgba(255, 107, 129, 0.4);
            padding: 8px 24px;
            border-radius: 50px;
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #ffb8c6;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b81, #ffb8c6, #ff6b81);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .name {
            font-size: clamp(1.5rem, 4vw, 2rem);
            color: #ffb8c6;
            margin-bottom: 40px;
            font-style: italic;
        }

        /* Блок для признания */
        .confession-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 107, 129, 0.3);
            border-radius: 20px;
            padding: 40px 30px;
            margin: 30px 0;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .confession-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(255, 107, 129, 0.15);
        }

        .confession-placeholder {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #c0c8d4;
            font-style: italic;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* Здесь ты потом напишешь своё признание */
        .confession-text {
            font-size: 1.15rem;
            line-height: 1.9;
            color: #e8e8f0;
            text-align: left;
            white-space: pre-wrap;
        }

        .divider {
            width: 60px;
            height: 1px;
            background: rgba(255, 107, 129, 0.5);
            margin: 40px auto;
        }

        .music-credit {
            font-size: 0.85rem;
            color: #667788;
            margin-top: 30px;
            letter-spacing: 1px;
        }

        .music-credit span {
            color: #ffb8c6;
        }

        /* Кнопка */
        .love-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: transparent;
            border: 1px solid #ff6b81;
            color: #ff6b81;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 2px;
        }

        .love-btn:hover {
            background: #ff6b81;
            color: #1a1a2e;
        }

        /* Адаптив */
        @media (max-width: 600px) {
            .confession-box {
                padding: 25px 18px;
            }
            h1 {
                letter-spacing: 2px;
            }
        }
    </style>
</head>
<body>

    <!-- Фоновые сердечки -->
    <div class="hearts-bg" id="heartsBg"></div>

    <!-- Экран входа -->
    <div id="intro-screen">
        <div class="intro-heart" id="startBtn">❤️</div>
        <div class="intro-text">Для Даши</div>
        <div class="click-hint">нажми на сердце</div>
    </div>

    <!-- Аудио (положи файл velosiped.mp3 рядом с html) -->
    <audio id="bgMusic" loop preload="auto">
        <source src="velosiped.mp3" type="audio/mpeg">
        Твой браузер не поддерживает аудио.
    </audio>

    <!-- Основной контент -->
    <div class="main-content" id="mainContent">
        <div class="anniversary-badge">6 месяцев вместе</div>
        <h1>Даша</h1>
        <div class="name">❤️ моя любимая ❤️</div>

        <div class="confession-box">
            <!-- ТУТ БУДЕТ ТВОЁ ПРИЗНАНИЕ -->
            <div class="confession-placeholder" id="confessionPlaceholder">
                Здесь будет твоё признание в любви...<br>
                <small style="color: #556677;">(открой файл и впиши текст вместо этого блока)</small>
            </div>
            <!--
            Чтобы вставить текст, удали блок <div class="confession-placeholder">...</div>
            и раскомментируй блок ниже, вписав свой текст:

            <div class="confession-text">
Даша, за эти полгода я понял...
(твой текст)
            </div>
            -->
        </div>

        <div class="divider"></div>

        <div class="music-credit">
            ♫ сейчас играет: <span>CUPSIZE — Велосипед</span>
        </div>

        <button class="love-btn" onclick="createHeartBurst()">❤️</button>
    </div>

    <script>
        // Запуск фоновых сердечек
        function initHearts() {
            const bg = document.getElementById('heartsBg');
            const hearts = ['❤️', '💕', '💗', '💖', '💘'];
            for (let i = 0; i < 25; i++) {
                const h = document.createElement('div');
                h.className = 'heart-float';
                h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                h.style.left = Math.random() * 100 + '%';
                h.style.fontSize = (12 + Math.random() * 20) + 'px';
                h.style.animationDuration = (8 + Math.random() * 12) + 's';
                h.style.animationDelay = (Math.random() * 10) + 's';
                bg.appendChild(h);
            }
        }
        initHearts();

        // Обработка клика по сердцу
        const introScreen = document.getElementById('intro-screen');
        const mainContent = document.getElementById('mainContent');
        const music = document.getElementById('bgMusic');
        const startBtn = document.getElementById('startBtn');

        startBtn.addEventListener('click', function() {
            // Скрываем экран входа
            introScreen.classList.add('hidden');
            // Показываем контент
            mainContent.classList.add('visible');
            // Запускаем музыку
            music.play().catch(function(e) {
                console.log('Аудио не запустилось:', e);
            });
        });

        // Взрыв сердечек по кнопке
        function createHeartBurst() {
            const hearts = ['❤️', '💕', '💖', '💗', '💘', '🌹'];
            for (let i = 0; i < 15; i++) {
                const h = document.createElement('div');
                h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                h.style.position = 'fixed';
                h.style.left = '50%';
                h.style.top = '50%';
                h.style.fontSize = (20 + Math.random() * 30) + 'px';
                h.style.pointerEvents = 'none';
                h.style.zIndex = '999';
                h.style.transition = 'all 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
                document.body.appendChild(h);

                const angle = Math.random() * Math.PI * 2;
                const dist = 100 + Math.random() * 300;
                const x = Math.cos(angle) * dist;
                const y = Math.sin(angle) * dist;

                requestAnimationFrame(function() {
                    h.style.transform = `translate(${x}px, ${y}px) scale(0)`;
                    h.style.opacity = '0';
                });

                setTimeout(function() {
                    h.remove();
                }, 1600);
            }
        }
    </script>
</body>
</html>
